# Eval batch. prefilled: true marks rows filled from a ground-truth file; review before scoring.
# must_include is required text. allowed_entities is the fixture inventory for UID and P2026 tokens.
# scan_count: N matches that integer in the answer. when_tiled_off replaces entity checks while live Tiled is off.
# Optional history_from: <case id> posts that case first in this session.
x-beamline-stages: &beamline_stages
  - "Beam stop"
  - "Detector"
  - "Diag 106"
  - "EPU"
  - "EPU5"
  - "Exit slits"
  - "Gold mesh"
  - "Higher Order Suppressor"
  - "M101"
  - "M103"
  - "M121"
  - "Middle slits (JJ)"
  - "Mono 101"
  - "PZT shutter"
  - "Photodiode"
  - "Ring lamp and video camera"
  - "Sample stage"
  - "Scatter slits (JJ)"
  - "Shutters"
  - "Storage ring"
  - "Upstream slits (JJ)"
x-stage-attribution: &stage_attribution
  - '(?i)(part of|on|belongs to|mounted on)\s+(the\s+)?(Ring\ lamp\ and\ video\ camera|Higher\ Order\ Suppressor|Upstream\ slits\ \(JJ\)|Scatter\ slits\ \(JJ\)|Middle\ slits\ \(JJ\)|Sample\ stage|Storage\ ring|PZT\ shutter|Exit\ slits|Photodiode|Beam\ stop|Gold\ mesh|Detector|Diag\ 106|Mono\ 101|Shutters|EPU5|M101|M103|M121|EPU)'
x-tiled-identity-ban: &tiled_identity_ban
  - 'P2026\d{5}(-\d{2})?(-S\d{2})?'
  - '[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}'
  - '(?i)Cheng\ Wang|Thomas\ Ferron'
