enums:

  EvidenceSourceEnum:
    description: How a source relates to a value it states (H3 F2, F8)
    permissible_values:
      reported:
        description: The paper's own result, stated in its own voice
      cited:
        description: >-
          A result the paper attributes to other work. A "reported" value inside a sentence that
          attributes it to other work is tagged cited.
      derived:
        description: A value the paper computes from its own stated results (e.g. d = 2 pi / q)
      assumed:
        description: >-
          A value assumed rather than measured, such as a nominal instrument setting. Never
          presented as the paper's own measurement.

  UncertaintyKindEnum:
    description: What a stated uncertainty means (H3 F3)
    permissible_values:
      standard_deviation:
        description: One standard deviation of the measured values
      standard_error:
        description: Standard error of the mean
      interval:
        description: A stated range or confidence interval
      unknown:
        description: An uncertainty is stated but the paper does not say which kind

  QuoteMatchEnum:
    description: How a quote was located in the stored source text
    permissible_values:
      exact:
        description: The quote occurs verbatim
      normalized:
        description: The quote occurs after the recorded normalization profile (whitespace, glyphs, NFKC)

  InstrumentKindEnum:
    description: The three instrument kinds the owner named at H3 (F5)
    permissible_values:
      beamline:
        description: A synchrotron or other beamline (e.g. ALS 11.0.1.2)
      endstation:
        description: An endstation on a beamline (e.g. the RSoXS endstation)
      detector:
        description: A detector (e.g. a CCD or a hybrid pixel detector)
