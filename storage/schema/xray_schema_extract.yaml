version: xray_v1

prefixes:
  matkg: https://w3id.org/matkg/
  xray: https://w3id.org/matkg/xray/
  linkml: https://w3id.org/linkml/
  xsd: http://www.w3.org/2001/XMLSchema#

default_prefix: xray
default_range: string

imports:
  - xray_schema
