id: https://w3id.org/matkg/rsoxs
name: rsoxs
title: RSoXS v1 overlay
description: >
  Thin rsoxs_v1 overlay on storage/schema/matkg_schema.yaml.
  Adds RSoXSMeasurement plus resonant-scattering slots used by term extraction.
  Do not merge this graph with the x-ray demo KG.
license: MIT
version: rsoxs_v1

prefixes:
  matkg: https://w3id.org/matkg/
  linkml: https://w3id.org/linkml/
  xsd: http://www.w3.org/2001/XMLSchema#

default_prefix: matkg
default_range: string

imports:
  - matkg_schema

classes:
  RSoXSMeasurement:
    is_a: ExperimentalTechnique
    description: >
      A resonant soft X-ray scattering measurement or simulation of one
      (RSoXS, R-SoXS, P-RSoXS, CyRSoXS). Prefer this class over the parent
      ExperimentalTechnique for RSoXS, polarized RSoXS, and resonant elastic
      soft X-ray scattering.
    slots:
      - photon_energy_eV
      - absorption_edge
      - scattering_technique
      - polarization
    slot_usage:
      technique_type:
        string_serialization: "rsoxs"
      scattering_technique:
        string_serialization: "RSoXS"

# NOTE: W3C PROV-O vocabulary reference (classes, relations, namespace) has been
# moved to storage/schema/prov_vocabulary.yaml to keep this file LinkML-valid.
# See app/modules/prov.py for Python implementation helpers.

slots:
  photon_energy_eV:
    description: Incident photon energy in electronvolts
    range: float
    domain: RSoXSMeasurement
    annotations:
      code_domain_feature: true

  absorption_edge:
    description: Absorption edge used for resonant contrast (e.g. C K-edge, N K-edge)
    range: string
    domain: RSoXSMeasurement
    annotations:
      code_domain_feature: true

  polarization:
    description: X-ray polarization state (linear, circular, unpolarized, P-RSoXS)
    range: string
    domain: RSoXSMeasurement
    annotations:
      code_domain_feature: true
