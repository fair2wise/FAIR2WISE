# Semantic retrieval stack: unpinned by design (platform-specific wheels; requirements/semantic.in),
# now fixed per platform by pixi.lock. torch is the PyTorch CPU build.
faiss-cpu = ">=1.14.2"
sentence-transformers = ">=5.5.1"
torch = { version = ">=2.12.0", index = "https://download.pytorch.org/whl/cpu" }
# Exact pin on purpose: langchain-core imports transformers whenever it is installed, and
# transformers < 5.20 imports torch eagerly, which the "importing the app package loads no torch"
# test (tests/canonicalization/test_canon_services.py) and cold-start time rule out.
transformers = "==5.20.1"
# huggingface-hub 2.x is a major jump from the 1.33 the baseline ran with; the image bakes the
# embedding models through its snapshot_download. Move it deliberately, not by resolver drift.
huggingface-hub = "==1.33.0"
# Docling replaced PyMuPDF (AGPL-3.0; H1 E2, T05): structure parsing through docling, plain page text,
# metadata and rendering through pypdfium2 (the PDF engine docling itself uses). Model weights are not
# part of the repo or the lock: images fetch them at build time (Dockerfile docling-models stage).
docling = ">=2.145.0"
pypdfium2 = "*"
# Command-line interfaces for new tools (ALS dev standards: Typer); also pulled in by docling.
typer = ">=0.12"
torchvision = { version = "*", index = "https://download.pytorch.org/whl/cpu" }

