# FAIR2WISE dependency workspace (pixi). Replaces the pip-compile locks in requirements/ as the
# single source of truth for the application, test, quality and Tiled-server environments.
#
# Install:  pixi install --locked            (default environment: application runtime)
#           pixi install --locked -e dev     (runtime + tests + lint/type tools)
# Run:      pixi run test | test-full | lint | typecheck | coverage   (see [tasks])
# Update:   edit this file, then `pixi lock` and commit pixi.lock (never hand-edit it).
#
# pixi.lock records the sha256 of every conda package and PyPI artifact; images and CI install
# with `--locked`, so any other bytes are refused (the hash-lock rule of audit AUD-08 / T28C).
#
# The physical tree stays app/ and installs as the import namespace `f2w` through pyproject.toml;
# this workspace pins the third-party stack only and does not install the project itself
# (images set PYTHONPATH=/app, checkouts run from the repo root).
#
# Python 3.12 only: PEP 695 generics and `X | None` annotations are used in app/.
[workspace]
name = "fair2wise"
channels = ["conda-forge"]
# linux-64 is the image/CI platform (O06 D2.8); osx-arm64 is the developer platform;
# linux-aarch64 lets Apple-silicon Docker (colima) build and check the images natively.
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]
channel-priority = "strict"

# faiss-cpu ships macosx_14_0_arm64 wheels only; pixi assumes macOS 13 unless told otherwise.
[system-requirements]
macos = "14.0"

# deepeval caps click<8.4.0 while huggingface-hub 1.33 (needed by transformers 5.20.1) requires
# click>=8.4.2. The pip environments the suite was written against carried that violation and ran
# fine, so the constraint is overridden here and the dev feature pins click to the version that ran.
[pypi-options.dependency-overrides]
click = ">=8.0"

[dependencies]
python = "3.12.*"

# ---- application runtime (was requirements/runtime.in + semantic.in) -------------------------
[pypi-dependencies]
