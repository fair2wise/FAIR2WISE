# ---- MkDocs site (image docs-build stage and `pixi run docs`) --------------------------------
[feature.docs.dependencies]
python = "3.12.*"

[feature.docs.pypi-dependencies]
mkdocs = "==1.6.1"
mkdocs-material = "==9.7.7"
mkdocs-mermaid2-plugin = ">=1.2.3"

[feature.docs.tasks]
docs = "mkdocs build --strict -f mkdocs/mkdocs.yml"

# ---- T27 quality tools (was requirements/quality.in) -----------------------------------------
[feature.quality.pypi-dependencies]
mypy = ">=1.20"
ruff = ">=0.15"
isort = ">=7"
pytest-cov = ">=7"
types-PyYAML = "*"
types-requests = "*"
types-jsonschema = "*"
types-psutil = "*"
lxml-stubs = "*"

# ---- optional: Academy/Globus Compute deployment (was requirements/globus.in) -----------------
# Isolated: globus-compute-endpoint==4.13.0 conflicts with the app's linkml-runtime range.
[feature.globus.dependencies]
python = "3.12.*"

[feature.globus.pypi-dependencies]
globus-sdk = ">=4.8,<5"
globus-compute-sdk = "==4.13.0"
globus-compute-endpoint = "==4.13.0"

# ---- optional: archived modules under app/modules/legacy (was requirements/legacy.in) ----------
[feature.legacy.pypi-dependencies]
rdflib = ">=7.6.0"

# ---- managed-Tiled server (isolated: tiled 0.2.18 needs pydantic-settings<2.12) ----------------
# Owner decision O-T1: PINNED_TILED_VERSION / PINNED_TILED_WHEEL_SHA256 in
# app/modules/deployment/tiled_config.py. tests/images check that pixi.lock holds that wheel hash.
[feature.tiled-server.dependencies]
python = "3.12.*"

[feature.tiled-server.pypi-dependencies]
tiled = { version = "==0.2.18", extras = ["server"] }

[environments]
dev = { features = ["dev", "quality", "docs"] }
docs = { features = ["docs"], no-default-feature = true }
globus = { features = ["globus"], no-default-feature = true }
legacy = { features = ["legacy"] }
tiled-server = { features = ["tiled-server"], no-default-feature = true }

[feature.dev.tasks]
# Parallel by default (pytest-xdist); -n is not in pytest.ini so single-test debugging and coverage stay serial.
# test: everything except the full-size scale tests (@pytest.mark.slow); test-full: those too.
test = "python -m pytest -n auto -m 'not slow' -q -p no:cacheprovider --ignore=tests/deepeval"
test-full = "python -m pytest -n auto -q -p no:cacheprovider --ignore=tests/deepeval"
test-slow = "python -m pytest -n auto -m slow -q -p no:cacheprovider --ignore=tests/deepeval"
lint = "flake8 app --exclude=app/modules/legacy,app/graphify-out --select=F"

[feature.quality.tasks]
typecheck = "mypy"
ruff = "ruff check app --statistics --exit-zero"
isort-check = "isort --check-only app"
coverage = "python -m pytest -q -p no:cacheprovider --ignore=tests/deepeval --cov"
