# so the move to pixi changes no behaviour). Upgrade deliberately: edit a pin, `pixi lock`, rerun
# the suite. Direct dependencies are the ones named in requirements/runtime.in and semantic.in.
# torch comes from the PyTorch CPU index: the default index resolves CUDA builds (+cu13x, ~3 GB of
# nvidia-* wheels) that no image can use.
