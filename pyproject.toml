# FAIR2WISE packaging (T04; ADR docs/adr/package-and-imports.md, optional-dependencies.md).
#
# The physical tree stays app/ (no src-layout move); it installs as the import
# namespace `f2w` and never as a top-level `app`. Checkout launches keep using
# `app.modules...`. One process uses one name (guard in app/__init__.py).
#
# The locked environments live in pixi.toml / pixi.lock (the single source of truth for CI and
# the images). The ranges below are the PyPI packaging metadata for `pip install fair2wise[...]`
# and mirror the direct dependencies in pixi.toml; they are not a lock.
#
# Not packaged: app/modules/legacy/ (archived, no __init__.py), app/run_pipeline_cborg.py
# (checkout-only script), scripts/, storage/, config.yml. Schemas, vocabularies and
# config.yml resolve from F2W_RESOURCE_ROOT (repo root in a checkout); see
# app/modules/resources.py.
[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fair2wise"
version = "0.1.0.dev0"
description = "FAIR2WISE literature knowledge-graph services, SDK and agents"
readme = "README.md"
license = { file = "LICENSE.txt" }
# Tested: CPython 3.12 (pixi.lock is solved for 3.12) on macOS arm64.
requires-python = ">=3.12"
dependencies = [
  # The application's direct runtime dependencies minus the packages split into extras below.
  "academy-py>=0.5.0",
  "aiohttp>=3.14.0",
  "arxiv>=4.0.0",
  "colorama>=0.4.6",
  "flask>=3.1.0",
  "linkml-runtime>=1.11.1",
  "mp-api>=0.46.1",
  "numpy>=2.4.6",
  "obonet>=1.1.1",
  "openai>=2.40.0",
  "psutil>=5.9,<8",
  "pyalex>=0.21",
  "pymatgen>=2026.5.4",
  "python-dotenv>=1.2.2",
  "PyYAML>=6.0.3",
  "rapidfuzz>=3.14.5",
  "requests>=2.33.1",
  "watchdog>=6.0.0",
]

[project.optional-dependencies]
# FastAPI surfaces (legacy UI API, kg_rag_api model API, future f2w.api.main).
api = [
  "fastapi>=0.136.3",
  "uvicorn>=0.48.0",
]
# LangGraph runtime (F2W_RUNTIME=langgraph) and its OpenAI-compatible model bridge.
agents = [
  "langchain-core>=1.4.0",
  "langchain-openai>=1.3.0",
  "langgraph>=1.2.0",
]
# Semantic retrieval (platform-specific wheels; fixed per platform by pixi.lock).
semantic = [
  "faiss-cpu>=1.14.2",
  "sentence-transformers>=5.5.1",
  "torch>=2.12.0",
]
# PDF parsing: Docling (structure) and pypdfium2 (page text, metadata, rendering). Replaces PyMuPDF
# (AGPL-3.0; docs/migration/reviews/H0/license_dependency_audit.md, E2). Model weights are not a
# dependency: images fetch them at build time (scripts/fetch_docling_models.py).
parser = [
  "docling>=2.145.0",
  "pypdfium2",
]
# Tiled Graph is reached over HTTP with the base dependencies. The `tiled` Python client
# (lazy import in tiled_graph.py) is not in the lock: Tiled pins pydantic-settings<2.12
# (ADR optional-dependencies decision 4). Filled by T08/T20B.
tiled = []
# Paper figures (T09): source-text-first extraction reads the PDF text layer with pypdfium2.
# OCR (rapidocr/onnxruntime) is an OPTIONAL fallback imported lazily; it is not in the lock and is
# not a dependency here. numpy is a base dependency.
figures = [
  "pypdfium2",
]
# Academy/Globus Compute deployment (pixi environment `globus`); not part of [full].
globus = [
  "globus-sdk>=4.8,<5",
  "globus-compute-sdk==4.13.0",
  "globus-compute-endpoint==4.13.0",
]
full = [
  "fair2wise[api,agents,semantic,parser,tiled,figures]",
]

[tool.setuptools]
package-dir = { "f2w" = "app" }
# Every app/ directory with an __init__.py (tests/packaging checks this list).
packages = [
  "f2w",
  "f2w.api",
  "f2w.modules",
  "f2w.modules.agent_runtime",
  "f2w.modules.agents",
  "f2w.modules.canonicalization",
  "f2w.modules.canonicalization.campaign",
  "f2w.modules.contracts",
  "f2w.modules.deployment",
  "f2w.modules.evidence",
  "f2w.modules.extraction",
  "f2w.modules.extraction.strategies",
  "f2w.modules.f2w_agent",
  "f2w.modules.graph",
  "f2w.modules.graph.backends",
  "f2w.modules.graph.imports",
  "f2w.modules.hybrid_rag",
  "f2w.modules.jobs",
  "f2w.modules.launchers",
  "f2w.modules.curation",
  "f2w.modules.literature",
  "f2w.modules.operations",
  "f2w.modules.provenance",
  "f2w.modules.runtime_bridge",
  "f2w.modules.schema",
  "f2w.modules.security",
  "f2w.modules.term_extractor",
  "f2w.modules.science",
  "f2w.modules.tools",
  "f2w.modules.vision",
  "f2w.modules.vision.kernels",
  "f2w.modules.workers",
]
include-package-data = false

# T27 code-quality closure (docs/migration/reviews/H7/sniff_findings.md). The tools are pinned in
# pixi.lock (pixi feature `quality`) and run by the `python-quality` job of forge-merge-ci.yml, which only
# reports (counts per rule, per module) until the findings are cleared; none of this alters runtime
# behaviour. Scope follows T27: app/ without app/modules/legacy/ and generated files.
[tool.ruff]
target-version = "py312"
line-length = 115
extend-exclude = ["app/modules/legacy", "app/graphify-out", "ui", "storage", "papers", "runs", "logs"]

[tool.ruff.lint]
# UP: pyupgrade (builtin generics, X | None); T20: print(); PTH: pathlib over os.path;
# D: pydocstyle (Google convention, ALS dev standards section 2).
select = ["UP", "T20", "PTH", "D"]
ignore = [
  "D105",  # magic-method docstrings add noise
  "D107",  # __init__ is documented on the class
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "T20"]
"scripts/**" = ["D", "T20"]
"examples/**" = ["D", "T20"]

[tool.isort]
# ALS section 3: stdlib, third-party, local, alphabetical inside each group (`import x` and
# `from x import y` sorted together).
profile = "black"
line_length = 115
force_sort_within_sections = true
known_first_party = ["app", "f2w"]
extend_skip = ["app/modules/legacy", "app/graphify-out", "ui", "storage", "papers", "runs", "logs"]

[tool.mypy]
python_version = "3.12"
files = ["app"]
exclude = ["^app/modules/legacy/", "^app/graphify-out/"]
namespace_packages = true
explicit_package_bases = true
strict = true
show_error_codes = true
pretty = false
# Untyped third-party packages (no stubs, or optional extras not in the quality environment).
[[tool.mypy.overrides]]
module = [
  "academy.*", "arxiv.*", "colorama.*", "faiss.*", "flask.*", "globus_sdk.*", "langchain_core.*",
  "langchain_openai.*", "langgraph.*", "linkml_runtime.*", "mp_api.*", "obonet.*", "pyalex.*",
  "pymatgen.*", "rapidfuzz.*", "rapidocr_onnxruntime.*", "sentence_transformers.*", "tiled.*",
  "torch.*", "watchdog.*", "pypdfium2.*", "docling.*", "docling_core.*",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["app"]
branch = false
omit = [
  "app/modules/legacy/*",
  "app/graphify-out/*",
  "*/__pycache__/*",
  "app/run_pipeline_cborg.py",
  "app/modules/canonicalization/migration.py",
]

[tool.coverage.report]
precision = 1
show_missing = false
skip_empty = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]
