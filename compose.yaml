name: fair2wise

# Product stack: agent API + UI. One command: docker compose up
# Secrets come from the host .env at runtime (env_file). Never COPY/.ARG keys.
# Do not set CBORG_IPV6_BIND here — a stale address fails with
# "Can't assign requested address". cborg_http probes a live global IPv6.
#
# ── Extract process note ──────────────────────────────────────────────────────
# scripts/run.py (paper extraction) is NOT managed here. Start it separately
# so it survives agent/UI restarts and terminal/session closure:
#
#   nohup python scripts/run.py ...  &       # background in current shell
#   tmux new-session -d -s extract 'python scripts/run.py ...'
#
# `docker compose down` stops agent+UI only; extraction is unaffected.
# ─────────────────────────────────────────────────────────────────────────────
#
# Ports (loopback only):
#   UI    127.0.0.1:5175  (never 5174 — that port is SSH)
#   Agent 127.0.0.1:8090  (browser uses VITE_F2W_AGENT_API_URL)
#
# Darwin / Docker Desktop: IPv6 egress to api.cborg.lbl.gov is unreliable
# because the Mac host GUA is not the Linux VM's source address. On macOS
# use ./scripts/start_rsoxs_stack.sh for CBorg, or Linux Docker with IPv6.
# Optional Linux host-network overlay: compose.hostnet.yaml

services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile
      target: agent
    env_file:
      - path: .env
        required: false
    environment:
      CBORG_BASE_URL: https://api.cborg.lbl.gov
      CBORG_IP_FAMILY: ipv6
      CBORG_FORCE_IPV6: "1"
      CBORG_IPV6_BIND: ""
      F2W_AGENT_HOST: 0.0.0.0
      F2W_AGENT_PORT: "8090"
      F2W_BACKEND: cborg
      F2W_MODEL: lbl/cborg-chat
      F2W_KG_MODE: json
      F2W_GRAPH: storage/kg/matkg_rsoxs_v1.json,storage/kg/matkg_bl1101_v2.json
      F2W_SCHEMA: storage/schema/rsoxs_schema.yaml
      F2W_WORKDIR: /app/runs/ui_session_rsoxs
      KG_RAG_BACKEND: cborg
      KG_RAG_CBORG_MODEL: lbl/cborg-chat
      KG_RAG_GRAPH_SOURCE: json
      KG_RAG_GRAPH: storage/kg/matkg_rsoxs_v1.json
      KG_RAG_RETRIEVAL_BACKEND: lexical
      PYSTOW_HOME: /app/.cache/pystow
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - ./storage/kg/matkg_rsoxs_v1.json:/app/storage/kg/matkg_rsoxs_v1.json:ro
      - ./storage/kg/matkg_bl1101_v1.json:/app/storage/kg/matkg_bl1101_v1.json:ro
      - ./storage/kg/matkg_bl1101_v2.json:/app/storage/kg/matkg_bl1101_v2.json:ro
      - ./storage/schema/rsoxs_schema.yaml:/app/storage/schema/rsoxs_schema.yaml:ro
      - ./storage/schema/bl1101_schema.yaml:/app/storage/schema/bl1101_schema.yaml:ro
      - agent-runs:/app/runs
      - agent-cache:/app/.cache
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8090/health"]
      interval: 5s
      timeout: 5s
      start_period: 45s
      retries: 24
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
      args:
        # Browser origin, not an in-container hostname. Map host 8090.
        VITE_F2W_AGENT_API_URL: http://127.0.0.1:8090
    ports:
      - "127.0.0.1:${F2W_UI_PORT:-5175}:80"
    depends_on:
      agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 12
    restart: unless-stopped

volumes:
  agent-runs:
  agent-cache:

networks:
  default:
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.30.91.0/24
        - subnet: fd5a:f210:a1d0::/64
