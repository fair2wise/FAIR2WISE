---
- name: Record the digest now in service (previous digest kept for rollback)
  ansible.builtin.command:
    argv:
      - python3
      - "{{ fair2wise_tools_dir }}/f2w_release_record.py"
      - --record-file
      - "{{ fair2wise_release_record }}"
      - record
      - --profile
      - "{{ fair2wise_profile }}"
      - --repository
      - "{{ fair2wise_image_repository }}"
      - --digest
      - "{{ fair2wise_image_digest }}"
      - --state-schema
      - "{{ fair2wise_state_schema }}"
      - --reason
      - "{{ fair2wise_rollout_reason }}"
      - --actor
      - "{{ ansible_user_id | default('ansible') }}"
  register: fair2wise_record_result
  changed_when: true

- name: Rollout receipt
  ansible.builtin.debug:
    msg: "{{ fair2wise_record_result.stdout | from_json }}"
