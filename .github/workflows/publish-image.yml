# Publish tested FAIR2WISE images to GHCR and move the channel tags (T24D).
#
# The O06 image tag rules are APPROVED (2026-10-30, owner decisions O-O6 D2.1-D2.10,
# docs/migration/reviews/H1/owner_decisions.md batches 16-18; the rules are written up in
# docs/migration/reviews/H6/o06_tag_rules_proposal.md). What runs here:
#
#   push to main, push of a vX.Y.Z tag (D2.1)
#       gate -> candidate (build-app.yml called with publish_candidate=true: the three images
#       are built, checked and saved in this same run) -> publish (environment ghcr-publish:
#       push the tested bytes as immutable sha-<40-hex commit>-<variant> tags, plus
#       vX.Y.Z-<variant> on a release tag (D2.5); then move :local and :als-dev to the new
#       digests) -> publish-als-prod (environment ghcr-als-prod: move :als-prod to the same
#       run's als-prod digest). All three channels follow every merge to main; there is no
#       dev-before-prod rule and no manual production promotion step (D2.1, D2.3).
#   workflow_dispatch (promote / rollback)
#       move one channel to an already published digest of that variant by a registry-side
#       re-tag: forward to any tested digest (D2.3), or back to an older one with
#       rollback=true and a reason. :local and :als-dev run in ghcr-publish, :als-prod in
#       ghcr-als-prod.
#
# Nothing is rebuilt at publication: the saved images are loaded and their ids and layers must
# equal the release manifest. Commit tags are immutable: an existing sha-* tag that resolves to
# other bytes refuses the publication, it is never overwritten. Each commit is published as
# a multi-arch index (linux/amd64 + linux/arm64, K3s pilot; D2.8 was amd64 only) over per-platform
# images built and tested on native runners; the legacy compose `agent` image is not published at all (D2.6). Nothing expires
# (D2.7): no GHCR retention policy, workflow artifacts at GitHub's 90-day maximum.
#
# Safety switch: every run fails in the `gate` job unless the repository variable O06_APPROVED
# is exactly "true", and every writer job checks it again before it logs in. The rules are
# approved; the owner sets the variable (a repository admin action) once the two environments
# exist. GitHub environment configuration (not YAML): the owner is the sole required reviewer of
# ghcr-publish and ghcr-als-prod and may approve their own runs (D2.2); both environments limit
# deployment branches/tags to main and v*.
#
# Credentials: only the job's GITHUB_TOKEN with packages: write, for ghcr.io
# (ghcr.io/<repository owner, lowercased>/fair2wise; D2.4 asked for public, which GitHub only grants
# when the owner sets the package visibility to public after the first publication). No repository or environment secret is
# referenced, so CBORG, Tiled and other runtime credentials never reach these jobs. Nothing here
# deploys to a host: Ansible rollout by digest is T24E/H7.
name: Publish images and move channels (O06)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      variant:
        description: "promote/rollback: channel to move"
        type: choice
        required: true
        options: [ local, als-dev, als-prod ]
      digest:
        description: "sha256:... of an already published image of that variant"
        type: string
        required: true
      rollback:
        description: "move the channel back to an older published digest"
        type: boolean
        default: false
      reason:
        description: "change or rollback reason (required for a rollback)"
        type: string
        default: ""

permissions: {}

jobs:
  gate:
    name: O06 switch, protected ref and inputs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      semver: ${{ steps.ref.outputs.semver }}
      image_repository: ${{ steps.ref.outputs.image_repository }}
    steps:
      - name: O06 switch set by the owner (rules approved 2026-10-30, O-O6; fails closed)
        env:
          O06_APPROVED: ${{ vars.O06_APPROVED }}
        run: |
          if [ "$O06_APPROVED" != "true" ]; then
            echo "::error::repository variable O06_APPROVED is not 'true'. The O06 rules are approved (2026-10-30, O-O6); the owner sets the variable once the ghcr-publish and ghcr-als-prod environments exist. Nothing is published."
            exit 1
          fi
      - name: Protected default branch or protected vX.Y.Z tag
        id: ref
        env:
          REF: ${{ github.ref }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          REF_PROTECTED: ${{ github.ref_protected }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -eu
          if [ "$REF_PROTECTED" != "true" ]; then
            echo "::error::$REF is not protected (branch protection or ruleset required)"; exit 1
          fi
          semver=""
          case "$REF_TYPE" in
            branch)
              if [ -z "$DEFAULT_BRANCH" ] || [ "$REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
                echo "::error::publishing runs only from the default branch $DEFAULT_BRANCH, not $REF"; exit 1
              fi ;;
            tag)
              if ! printf '%s' "$REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
                echo "::error::$REF_NAME is not a vMAJOR.MINOR.PATCH release tag"; exit 1
              fi
              semver="$REF_NAME" ;;
            *)
              echo "::error::unsupported ref $REF"; exit 1 ;;
          esac
          echo "semver=$semver" >> "$GITHUB_OUTPUT"
          echo "image_repository=$(printf 'ghcr.io/%s/fair2wise' "$OWNER" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - name: Validate the inputs
        env:
          EVENT: ${{ github.event_name }}
          VARIANT: ${{ inputs.variant }}
          DIGEST: ${{ inputs.digest }}
          ROLLBACK: ${{ inputs.rollback }}
          REASON: ${{ inputs.reason }}
        run: |
          set -eu
          fail() { echo "::error::$1"; exit 1; }
          case "$EVENT" in
            push)
              [ -z "$VARIANT" ] && [ -z "$DIGEST" ] || fail "a push publishes the build; it takes no variant or digest" ;;
            workflow_dispatch)
              case "$VARIANT" in local|als-dev|als-prod) ;; *) fail "promote needs a variant" ;; esac
              printf '%s' "$DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$' || fail "digest must be sha256:<64 hex>"
              if [ "$ROLLBACK" = "true" ] && [ -z "$REASON" ]; then fail "a rollback needs a reason"; fi ;;
            *) fail "unsupported event $EVENT" ;;
          esac

  candidate:
    name: Build, check and save the three candidates of this commit (build-app.yml)
    needs: gate
    if: github.event_name == 'push'
    uses: ./.github/workflows/build-app.yml
    with:
      publish_candidate: true
    permissions:
      contents: read

  publish:
    name: Publish the tested candidate (immutable tags) and move :local and :als-dev
    needs: [ gate, candidate ]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: ghcr-publish
    # One registry writer at a time; a running publication or promotion is never cancelled.
    concurrency:
      group: publish-image-ghcr
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      packages: write
    env:
      IMAGE_REPOSITORY: ${{ needs.gate.outputs.image_repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with: { fetch-depth: 0, persist-credentials: false }
      - name: O06 still approved
        env:
          O06_APPROVED: ${{ vars.O06_APPROVED }}
        run: test "$O06_APPROVED" = "true"
      - name: Download this run's manifests and tested images, one set per platform (built by the candidate job)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" -n "release-manifest-$arch" -D "candidate/$arch/manifest"
            gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" -n "release-images-$arch" -D "candidate/$arch/images"
          done
      - name: Verify each manifest, then load and verify the images
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            python3 scripts/ci/release_manifest.py verify \
              --manifest "candidate/$arch/manifest/release-manifest.json" --commit "$GITHUB_SHA" --platform "linux/$arch"
            (cd "candidate/$arch/images" && sha256sum -c images.tar.gz.sha256)
            gunzip -c "candidate/$arch/images/images.tar.gz" | docker load
            docker image inspect "f2w-candidate:local-$arch" "f2w-candidate:als-dev-$arch" "f2w-candidate:als-prod-$arch" > "$RUNNER_TEMP/loaded-$arch.json"
            python3 scripts/ci/release_manifest.py verify \
              --manifest "candidate/$arch/manifest/release-manifest.json" --commit "$GITHUB_SHA" --platform "linux/$arch" \
              --inspect "$RUNNER_TEMP/loaded-$arch.json" \
              --ref "local=f2w-candidate:local-$arch" --ref "als-dev=f2w-candidate:als-dev-$arch" --ref "als-prod=f2w-candidate:als-prod-$arch"
          done
      - name: Log in to ghcr.io with the job token
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
      - name: Push immutable tags and record the digests (never overwrites an existing sha-* tag)
        env:
          SEMVER: ${{ needs.gate.outputs.semver }}
        run: |
          set -euo pipefail
          python3 scripts/ci/publish_candidate.py \
            --manifest candidate/amd64/manifest/release-manifest.json candidate/arm64/manifest/release-manifest.json \
            --repository "$IMAGE_REPOSITORY" \
            --commit "$GITHUB_SHA" --semver "$SEMVER" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --actor "$GITHUB_ACTOR" \
            --out publication/release-publication.json
          {
            echo "### Published $GITHUB_SHA"
            echo '```json'
            python3 -c 'import json,sys; p=json.load(open(sys.argv[1])); print(json.dumps(p["variants"], indent=2))' publication/release-publication.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Move :local and :als-dev to the digests just published (re-tag, no rebuild; D2.1)
        run: |
          set -euo pipefail
          for variant in local als-dev; do
            digest="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["variants"][sys.argv[2]]["digest"])' \
              publication/release-publication.json "$variant")"
            python3 scripts/ci/promote_channel.py --repository "$IMAGE_REPOSITORY" --variant "$variant" \
              --digest "$digest" --rollback false --reason "publish $GITHUB_SHA" --actor "$GITHUB_ACTOR" \
              --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              --out "publication/channel-$variant.json" | tee -a "$GITHUB_STEP_SUMMARY"
          done
      - name: Log out
        if: always()
        run: docker logout ghcr.io
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: release-publication
          path: publication/
          retention-days: 90
          if-no-files-found: error

  publish-als-prod:
    name: Move :als-prod to this run's published als-prod digest (production environment)
    needs: [ gate, publish ]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ghcr-als-prod
    concurrency:
      group: publish-image-ghcr
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      packages: write
    env:
      IMAGE_REPOSITORY: ${{ needs.gate.outputs.image_repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with: { fetch-depth: 0, persist-credentials: false }
      - name: O06 still approved
        env:
          O06_APPROVED: ${{ vars.O06_APPROVED }}
        run: test "$O06_APPROVED" = "true"
      - name: Download this run's publication record
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" -n release-publication -D publication
      - name: Log in to ghcr.io with the job token
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
      - name: Move :als-prod to the tested als-prod digest of this commit (re-tag, no rebuild; D2.1, D2.3)
        run: |
          set -euo pipefail
          digest="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["variants"]["als-prod"]["digest"])' \
            publication/release-publication.json)"
          python3 scripts/ci/promote_channel.py --repository "$IMAGE_REPOSITORY" --variant als-prod \
            --digest "$digest" --rollback false --reason "publish $GITHUB_SHA" --actor "$GITHUB_ACTOR" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --out promotion/promotion.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Log out
        if: always()
        run: docker logout ghcr.io
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: promotion-als-prod
          path: promotion/
          retention-days: 90
          if-no-files-found: error

  promote:
    name: Dispatch, move :local or :als-dev to a published digest (promote or rollback)
    needs: gate
    if: github.event_name == 'workflow_dispatch' && (inputs.variant == 'local' || inputs.variant == 'als-dev')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ghcr-publish
    concurrency:
      group: publish-image-ghcr
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_REPOSITORY: ${{ needs.gate.outputs.image_repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with: { fetch-depth: 0, persist-credentials: false }
      - name: O06 still approved
        env:
          O06_APPROVED: ${{ vars.O06_APPROVED }}
        run: test "$O06_APPROVED" = "true"
      - name: Log in to ghcr.io with the job token
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
      - name: Re-tag the published digest (no rebuild)
        env:
          VARIANT: ${{ inputs.variant }}
          DIGEST: ${{ inputs.digest }}
          ROLLBACK: ${{ inputs.rollback }}
          REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          python3 scripts/ci/promote_channel.py --repository "$IMAGE_REPOSITORY" --variant "$VARIANT" \
            --digest "$DIGEST" --rollback "$ROLLBACK" --reason "$REASON" --actor "$GITHUB_ACTOR" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --out promotion/promotion.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Log out
        if: always()
        run: docker logout ghcr.io
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: promotion-${{ inputs.variant }}
          path: promotion/
          retention-days: 90
          if-no-files-found: error

  promote-als-prod:
    name: Dispatch, move :als-prod to a published digest (promote or rollback, production environment)
    needs: gate
    if: github.event_name == 'workflow_dispatch' && inputs.variant == 'als-prod'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ghcr-als-prod
    concurrency:
      group: publish-image-ghcr
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_REPOSITORY: ${{ needs.gate.outputs.image_repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with: { fetch-depth: 0, persist-credentials: false }
      - name: O06 still approved
        env:
          O06_APPROVED: ${{ vars.O06_APPROVED }}
        run: test "$O06_APPROVED" = "true"
      - name: Log in to ghcr.io with the job token
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
      - name: Re-tag the published als-prod digest (any tested digest, D2.3; no rebuild)
        env:
          VARIANT: ${{ inputs.variant }}
          DIGEST: ${{ inputs.digest }}
          ROLLBACK: ${{ inputs.rollback }}
          REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          python3 scripts/ci/promote_channel.py --repository "$IMAGE_REPOSITORY" --variant "$VARIANT" \
            --digest "$DIGEST" --rollback "$ROLLBACK" --reason "$REASON" --actor "$GITHUB_ACTOR" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --out promotion/promotion.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Log out
        if: always()
        run: docker logout ghcr.io
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: promotion-als-prod
          path: promotion/
          retention-days: 90
          if-no-files-found: error
