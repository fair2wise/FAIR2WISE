# Validation for the FORGE-to-F2W migration branch (T01/T18A).
# Tests only: no deployment, publishing, registry, Pages or secrets.
# CI split (owner pilot task 11): a push runs only lint, type checks and unit tests (target under 5 minutes,
# the unit suite is sharded three ways); the Tiled-backed suites, Playwright, coverage and the Docling
# model download run nightly, on workflow_dispatch, or when the head commit message contains "[ci full]".
# Image builds left this branch entirely (build-app.yml). docs/ci.md lists every moved job.
# Plan: docs/migration/ui_contracts/ci_plan.md
name: forge_merge validation

on:
  push:
    branches: [ forge_merge ]
  pull_request:
    branches: [ forge_merge ]
  workflow_dispatch: {}
  schedule:
    - cron: "17 6 * * *"  # nightly: the full-size scale tests (job python-slow-suite)

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  # Re-pinned 2026-10-16 (owner O-U1): T24C build-base router/logo change for /fair2wise.
  # Re-pinned 2026-10-16 (owner O-U2): T11B additive validation judge-model dropdown in the
  # settings panel (JudgeModelSetting, judgeModel.ts, e2e judge-model.spec.ts); previous 2cc7ccd3.
  # Re-pinned 2026-11-03 (owner O-U4, T43): A8 Library, Extract and Harvester tabs (T40-T42, T46:
  # LibraryTab, ExtractionTab, library/, extraction/, harvest api and hooks, KeepAliveMainContent, App.tsx
  # routes, e2e library/extraction/harvester specs) plus the T18D UI files (317411b); previous a9c222b1.
  # PRs touching ui/ carry the ui-change-approved label. See docs/migration/ui_contracts/a8_library_tabs.md.
  # Re-pinned 2026-11-20 (owner: "yes go fix"): UI work since 2026-11-03, each owner requested: Save edits the
  # corpus on screen, Pending Approvals page, source pill and model-list fix, truncation notice, Publish to
  # Tiled button and dialog, 300-node large-graph overview (T-save-corpus, T-approvals-ui, 93ab876, 93f5ab3,
  # 4046edb); previous 059b7a46.
  # Re-pinned 2026-11-23 (owner bug list, task 8): Harvester shows papers as found/downloading/settled with a
  # failure reason while the run goes; previous e627b360.
  # Re-pinned 2026-11-23 (owner bug list, task 5): KG viewer defaults to a JSON source (GraphSourceSelect, graphSourceStore, graphSourcesApi, agentSettings fallback); previous fe160a2d.
  # Re-pinned 2026-11-23 (owner bug list, task 6): KG viewer defaults to force-directed where force is allowed (GraphMockup, largeGraphPolicy, test setup, e2e spec); previous f6449d9a.
  # Re-pinned 2026-11-23 (owner bug list, task 9): shared category list: Enter/Add category creates and selects it in Papers and Harvester; previous 2607239b.
  # Re-pinned 2026-11-23 (owner bug list, task 2): provider refusal wording (providerErrors; judge model setting and extraction toasts show the CBORG address refusal); previous fe17f58d.
  # Re-pinned 2026-11-23 (owner bug list, task 10): Library list shows stored year, authors and abstract with a not-stored marker; previous bdf888d3.
  # Re-pinned 2026-11-23 (owner bug list, task 7): chat citation click loads the full entity record (GraphMockup NodeDetailPanel, nodeDetailSource, liveAgent type); previous f780e527.
  # Re-pinned 2026-11-23 (owner bug list, task 3): Extract tab model list: CBORG address-refusal reason and Ollama models in a grouped picker (modelChoices, ExtractionIdleForm, extractionApi); previous e1a6fec0.
  # Re-pinned 2026-11-23 (owner bug list, task 4): Ollama model dropdown in Settings (OllamaModelSetting, ollamaApi) fed by GET /v1/ollama/models; previous a21f0906.
  # Re-pinned 2026-11-23 (owner request, extraction feedback): Extract page shows live progress, KG growth, a filterable log, a runs list and survives reload/tab switch (ExtractionTab, extraction/Run*, useJobLogPolling, extractionApi/Hooks, KeepAliveMainContent, tabActivity); previous b34dce75.
  FROZEN_UI_TREE: 3a06a1f95aa4ae3fe365d7fd6eb622e45409de67
  KG_RAG_RETRIEVAL_BACKEND: lexical
  KG_RAG_FORCE_CPU: "1"
  F2W_SOURCE_RAG: "0"
  F2W_LIVE_TILED: "0"

jobs:
  guard:
    name: Isolation, frozen-UI guard and changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      python: ${{ steps.paths.outputs.python }}
      frontend: ${{ steps.paths.outputs.frontend }}
      docs: ${{ steps.paths.outputs.docs }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with: { fetch-depth: 0 }
      - name: No .env in the checkout
        run: test ! -e .env
      - name: Frozen UI tree unchanged
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'ui-change-approved') }}
        run: |
          actual="$(git rev-parse HEAD:ui)"
          echo "ui tree: $actual"
          test "$actual" = "$FROZEN_UI_TREE"
      # Path filter: docs-only changes skip the Python and frontend jobs, UI-only changes skip the Python jobs,
      # Python-only changes skip the frontend jobs. Unknown base, dispatch and schedule run everything.
      - name: Which job groups does this change need? (scripts/ci/changed_paths.py)
        id: paths
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$EVENT" = push ] || [ "$EVENT" = pull_request ]; then
            python3 scripts/ci/changed_paths.py --base "$BASE_SHA" --head "$GITHUB_SHA"
          else
            python3 scripts/ci/changed_paths.py --force-all
          fi

  python-contracts:
    name: Python contract tests
    needs: guard
    if: ${{ needs.guard.outputs.python == 'true' }}
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Install pixi (pinned release, sha256-verified)
        run: scripts/ci/install_pixi.sh
      - name: Install the locked dev environment (pixi.lock, --locked)
        run: |
          pixi install --locked -e dev
          echo "$PWD/.pixi/envs/dev/bin" >> "$GITHUB_PATH"
      - name: Contract suites (shared contracts, legacy UI, JSON KG)
        run: |
          mkdir -p "$RUNNER_TEMP/home"
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/home" TMPDIR="$RUNNER_TEMP" LANG=C.UTF-8 \
            python -m pytest tests/contracts -n auto -m "not slow" -q -p no:cacheprovider --junitxml=contracts.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with: { name: contracts-junit, path: contracts.xml }

  python-baseline-suite:
    name: Unit tests, shard ${{ matrix.shard }} of 3 (known failures gate)
    needs: guard
    if: ${{ needs.guard.outputs.python == 'true' }}
    timeout-minutes: 15
    runs-on: ubuntu-latest
    # Three shards (scripts/ci/pytest_shard.py: crc32 of the test id) run in parallel; measured serially-equivalent
    # cost of the not-slow suite without Tiled and Docling weights is ~340 s on 4 workers, so one job would
    # miss the 5 minute target. Every test is in exactly one shard.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Install pixi (pinned release, sha256-verified)
        run: scripts/ci/install_pixi.sh
      - name: Install the locked dev environment (pixi.lock, --locked)
        run: |
          pixi install --locked -e dev
          echo "$PWD/.pixi/envs/dev/bin" >> "$GITHUB_PATH"
      # The pytest exit status is not the gate: a failure that is in the recorded
      # known-failure set is tolerated, any other failure (or a known one now passing)
      # fails the next step. The JUnit file must exist, so a crash before any test ran
      # fails here instead of being compared against nothing (T28B, audit AUD-09).
      # The tests that need Docling model weights skip here (no model download on a push); the
      # nightly job python-nightly-full fetches the weights and runs them.
      - name: Unit tests, shard ${{ matrix.shard }} of 3, parallel, without the slow full-size scale tests (failures recorded, not hidden)
        env:
          SHARD: ${{ matrix.shard }}/3
        run: |
          mkdir -p "$RUNNER_TEMP/home"
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/home" TMPDIR="$RUNNER_TEMP" LANG=C.UTF-8 \
            HF_HUB_OFFLINE=1 F2W_SHARD="$SHARD" \
            python -m pytest -p scripts.ci.pytest_shard -n auto -m "not slow" -q -p no:cacheprovider --junitxml=full.xml; status=$?
          test -s full.xml || exit "$status"
      - name: Compare with the known-failure set (the gate)
        run: python scripts/ci/compare_known_failures.py full.xml docs/migration/reviews/H0/known_failures.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with: { name: "full-junit-${{ matrix.shard }}", path: full.xml }

  python-quality:
    # T27 (docs/migration/reviews/H7/sniff_findings.md): measures typing, docstring, pathlib,
    # print, import-order and coverage findings. The report steps tolerate their own failure so the
    # numbers are always produced; ruff, isort and mypy are at 0 and the gate step below keeps them there
    # (it runs after the reports and the artifact is uploaded either way). Coverage moved to the nightly job python-nightly-full.
    # Configuration lives in pyproject.toml; tool versions are locked in pixi.lock (feature `quality`).
    name: Code quality (T27, ruff isort mypy gate; coverage is nightly)
    needs: guard
    if: ${{ needs.guard.outputs.python == 'true' }}
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Install pixi (pinned release, sha256-verified)
        run: scripts/ci/install_pixi.sh
      - name: Install the locked dev environment (pixi.lock, --locked)
        run: |
          pixi install --locked -e dev
          echo "$PWD/.pixi/envs/dev/bin" >> "$GITHUB_PATH"
      - name: Lint counts (ruff UP, T20, PTH, D) and import order (isort)
        run: |
          mkdir -p quality
          ruff check app --statistics --exit-zero | tee quality/ruff_statistics.txt
          ruff check app --output-format concise --exit-zero > quality/ruff_findings.txt
          isort --check-only app > quality/isort.txt 2>&1 || true
          echo "isort files needing changes: $(grep -c '^ERROR' quality/isort.txt || true)"
      - name: Types (mypy --strict)
        run: mypy 2>&1 | tee quality/mypy.txt | tail -n 3 || true
      - name: Gate (ruff, isort and mypy --strict are at 0 findings; no module mixes docstring styles)
        run: |
          ruff check app
          isort --check-only app
          mypy
          python scripts/ci/docstring_style.py --check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with: { name: quality-report, path: quality }

  python-tiled-suites:
    # The ~260 tests behind tests/fixtures/tiled_server.py skip without F2W_TILED_PYTHON.
    # This job gives them the same isolated tiled[server]==0.2.18 environment as the
    # :local image (Dockerfile tiled-server-build): the locked pixi `tiled-server` environment,
    # whose pixi.lock entry carries the owner-pinned wheel hash (O-T1, PINNED_TILED_WHEEL_SHA256
    # in app/modules/deployment/tiled_config.py), installed with --locked. Never into the app
    # environment. Servers are disposable 127.0.0.1 instances on ephemeral ports; no central
    # Tiled, no credentials (T28B, AUD-09).
    name: Tiled-backed suites (disposable 0.2.18 servers)
    needs: guard
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[ci full]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Install pixi (pinned release, sha256-verified)
        run: scripts/ci/install_pixi.sh
      - name: Install the locked dev environment (pixi.lock, --locked)
        run: |
          pixi install --locked -e dev
          echo "$PWD/.pixi/envs/dev/bin" >> "$GITHUB_PATH"
      - name: Isolated Tiled 0.2.18 server environment (owner-pinned wheel hash in pixi.lock)
        run: |
          # The server gets its own locked pixi environment (tiled needs pydantic-settings<2.12).
          # pixi.lock records the sha256 of every artifact and --locked refuses any other bytes;
          # the owner pin (O-T1) is asserted against the lock before anything is installed.
          grep -q "sha256: 416079d4b5c9acc5498197d48c05a951ee8f7c699ac3b07920ae907a8da7fa06" pixi.lock
          pixi install --locked -e tiled-server
          "$PWD/.pixi/envs/tiled-server/bin/python" -I -c "import sys, tiled; sys.exit(tiled.__version__ != '0.2.18')"
      - name: Tiled-backed suites
        run: |
          mkdir -p "$RUNNER_TEMP/home"
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/home" TMPDIR="$RUNNER_TEMP" LANG=C.UTF-8 \
            F2W_TILED_PYTHON="$PWD/.pixi/envs/tiled-server/bin/python" \
            python -m pytest tests/tiled tests/graph tests/graph_import tests/security_live tests/api_v1_live \
              tests/images tests/contracts/legacy_ui/closure \
              -n auto -m "not slow" -q -p no:cacheprovider --junitxml=tiled.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with: { name: tiled-junit, path: tiled.xml }

  python-slow-suite:
    # The full-size variants of the scale tests (pytest.mark.slow: 60k-entity populations, a 15k-entity
    # disposable Tiled server). Nightly and on manual dispatch only; the default jobs run -m "not slow".
    name: Slow full-size scale tests (nightly)
    needs: guard
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Install pixi (pinned release, sha256-verified)
        run: scripts/ci/install_pixi.sh
      - name: Install the locked dev environment (pixi.lock, --locked)
        run: |
          pixi install --locked -e dev
          echo "$PWD/.pixi/envs/dev/bin" >> "$GITHUB_PATH"
      - name: Isolated Tiled 0.2.18 server environment (locked)
        run: |
          pixi install --locked -e tiled-server
          "$PWD/.pixi/envs/tiled-server/bin/python" -I -c "import sys, tiled; sys.exit(tiled.__version__ != '0.2.18')"
      - name: Slow tests
        run: |
          mkdir -p "$RUNNER_TEMP/home"
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/home" TMPDIR="$RUNNER_TEMP" LANG=C.UTF-8 \
            F2W_TILED_PYTHON="$PWD/.pixi/envs/tiled-server/bin/python" \
            python -m pytest tests/operations -n auto -m slow -q -p no:cacheprovider --junitxml=slow.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with: { name: slow-junit, path: slow.xml }

  python-nightly-full:
    # Moved off the push path: the real Docling conversions (model weights downloaded from pinned commits)
    # and the coverage run (report only; serial before, now xdist). Nightly, dispatch or "[ci full]".
    name: Docling-backed tests and coverage (nightly)
    needs: guard
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[ci full]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Install pixi (pinned release, sha256-verified)
        run: scripts/ci/install_pixi.sh
      - name: Install the locked dev environment (pixi.lock, --locked)
        run: |
          pixi install --locked -e dev
          echo "$PWD/.pixi/envs/dev/bin" >> "$GITHUB_PATH"
      - name: Docling model weights (pinned commits, scripts/fetch_docling_models.py)
        # Not in the repo or the lock: the parser tests that run real Docling conversions read them from here.
        run: python scripts/fetch_docling_models.py --dest "$RUNNER_TEMP/docling"
      - name: Coverage (full not-slow suite with the Docling weights, T27 80% target per module, report only)
        run: |
          mkdir -p quality "$RUNNER_TEMP/home"
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/home" TMPDIR="$RUNNER_TEMP" LANG=C.UTF-8 \
            HF_HUB_OFFLINE=1 F2W_DOCLING_ARTIFACTS_PATH="$RUNNER_TEMP/docling" \
            python -m pytest -n auto -m "not slow" -q -p no:cacheprovider --cov --cov-report= || true
          coverage combine 2>/dev/null || true
          coverage report --skip-empty > quality/coverage.txt || true
          tail -n 3 quality/coverage.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with: { name: coverage-report, path: quality }

  import-closure:
    name: Syntax check and legacy entrypoints
    needs: guard
    if: ${{ needs.guard.outputs.python == 'true' }}
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Install pixi (pinned release, sha256-verified)
        run: scripts/ci/install_pixi.sh
      - name: Install the locked dev environment (pixi.lock, --locked)
        run: |
          pixi install --locked -e dev
          echo "$PWD/.pixi/envs/dev/bin" >> "$GITHUB_PATH"
      - name: Syntax / undefined names vs known pre-existing violations
        # Two F821 violations exist at baseline 222b1e7 (dead code in api.py, an
        # annotation in monitored_agent.py). They are tracked, not ignored: any new
        # or changed violation fails. Line numbers are dropped because they shift.
        run: |
          flake8 . --select=E9,F63,F7,F82 --format='%(path)s %(code)s %(text)s' | sort > lint.txt || true
          diff -u docs/migration/reviews/H0/known_lint.txt lint.txt
      - name: Pyflakes (all F codes) on app/ vs known violations (T27)
        # Stricter than the step above: unused imports/variables, shadowing and f-strings without
        # placeholders in app/ (legacy/ excluded). The recorded set is the baseline at T27; a new
        # violation fails, a fixed one fails too until it is removed from the file, so the list
        # only shrinks. Some F401 entries are intentional re-exports (e.g. coordinator agent
        # classes, multi_kg names in f2w_agent/api.py): clear them with `# noqa: F401` plus a
        # reason, then drop the line. Line numbers are dropped because they shift.
        run: |
          flake8 app --exclude=app/modules/legacy,app/graphify-out,__pycache__ --select=F \
            --format='%(path)s %(code)s %(text)s' | sed -E 's/ from line [0-9]+//' | sort > pyflakes.txt || true
          diff -u docs/migration/reviews/H7/known_pyflakes.txt pyflakes.txt
      - name: Legacy entrypoints importable with unchanged signatures
        run: |
          mkdir -p "$RUNNER_TEMP/home"
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/home" PYTHONPATH="$PWD" python - <<'EOF'
          import inspect
          from app.modules.f2w_agent import api
          from app.modules import kg_rag_api
          # Backward compatible: old callers create_app(cfg, cors_origins=...) still work;
          # parameters added since the baseline are keyword-only with defaults.
          params = list(inspect.signature(api.create_app).parameters.values())
          assert params[0].name == "cfg" and params[0].kind is params[0].POSITIONAL_OR_KEYWORD, params
          extra = {p.name: p for p in params[1:]}
          assert extra["cors_origins"].kind is extra["cors_origins"].KEYWORD_ONLY and extra["cors_origins"].default is None
          assert all(p.kind is p.KEYWORD_ONLY and p.default is not p.empty for p in extra.values()), params
          assert callable(api.run_api)
          assert str(inspect.signature(kg_rag_api.create_fastapi_app)).startswith("(graph_file: 'str'")
          print("legacy entrypoints ok")
          EOF

  frontend:
    name: Frontend unit tests and build (frozen UI)
    needs: guard
    if: ${{ needs.guard.outputs.frontend == 'true' }}
    timeout-minutes: 15
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ui } }
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: standalone-dev
            base: /
            api: ""
          - name: fair2wise-prefix
            base: /fair2wise/
            api: /fair2wise/api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm, cache-dependency-path: ui/package-lock.json }
      - run: npm ci
      - run: npm test
      - name: vite build (${{ matrix.name }})
        env:
          VITE_F2W_AGENT_API_URL: ${{ matrix.api }}
        run: npx vite build --base "${{ matrix.base }}"

  playwright-mocked:
    name: Existing Playwright suite (mocked backend)
    needs: guard
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[ci full]') }}
    timeout-minutes: 30
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ui } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm, cache-dependency-path: ui/package-lock.json }
      - run: npm ci
      - run: npx playwright install --with-deps chrome
      # `github` adds an annotation per failure (file, line, message) readable without the logs; `html` feeds the artifact.
      - run: npx playwright test --reporter=line,github,html
        env: { CI: "1" }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: failure()
        with: { name: playwright-report, path: ui/playwright-report }

  docs-build:
    name: MkDocs strict build (no publish)
    needs: guard
    if: ${{ needs.guard.outputs.docs == 'true' }}
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Install pixi (pinned release, sha256-verified)
        run: scripts/ci/install_pixi.sh
      - name: Install the locked docs environment (pixi.lock, --locked)
        run: |
          pixi install --locked -e docs
          echo "$PWD/.pixi/envs/docs/bin" >> "$GITHUB_PATH"
      - run: mkdocs build --strict -f mkdocs/mkdocs.yml

  # Still to add when its fixtures exist: real-API browser tests against the frozen UI
  # (T18B, required at H2). The disposable-Tiled suites (T20B/T08B/T25C/T18C) run in
  # python-tiled-suites above.
