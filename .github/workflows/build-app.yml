# Build, check and record the three FAIR2WISE image candidates (T24D; O06 rules approved
# 2026-10-30, owner decisions O-O6 D2.1-D2.10).
#
# One commit -> :local, :als-dev, :als-prod candidates -> tests/images static checks and the
# docker/profiles/README.md post-build checks on every built image -> release-manifest.json
# (commit, per-variant image id and layers, lock hashes, Tiled wheel hash, FROZEN_UI_TREE,
# resolved base-image digests (D2.9) and the newest binary report reference (D2.10, never
# gating)). Only linux/amd64 is built (D2.8).
#
# Nothing here publishes, logs in to a registry or deploys. Candidates are handed to
# publish-image.yml only as workflow artifacts of trusted (non pull_request) runs. On a push
# to main or a v* tag, publish-image.yml calls this workflow (workflow_call, input
# publish_candidate=true) and publishes the artifacts of that same run inside its GitHub
# environments; the standalone run for a push to main therefore only runs the legacy test
# and docs jobs, so each main commit is built once. forge_merge pushes and pull requests build
# and check candidates without publishing anything.
# No secret is referenced: candidates never receive CBORG, Tiled or any runtime credential, and
# every check container runs with --network none.
#
# The legacy main-branch test job keeps its behaviour; the MkDocs gh-deploy and README tree
# steps moved into docs-deploy, the only job with a write permission, which runs only on a
# standalone push to main and never for a pull request or inside the publish workflow.
name: Build and check image candidates

on:
  push:
    branches: [ main, forge_merge ]
  pull_request:
    branches: [ main, forge_merge ]
  workflow_dispatch: {}
  workflow_call:
    inputs:
      publish_candidate:
        description: "set by publish-image.yml: build and save the candidates of this main/v* commit for publication"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: build-app-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.12"
  BASE_PYTHON_IMAGE: python:3.12-slim
  BASE_NODE_IMAGE: node:20-bookworm-slim
  CANDIDATE: f2w-candidate

jobs:
  test:
    name: Legacy test suite (main)
    # Not inside the publish workflow's call: the standalone push-to-main run owns it.
    if: (github.ref == 'refs/heads/main' || github.base_ref == 'main') && !inputs.publish_candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with: { persist-credentials: false }
      - name: Install pixi (pinned release, sha256-verified)
        run: scripts/ci/install_pixi.sh
      - name: Install the locked dev environment (pixi.lock, --locked)
        run: |
          pixi install --locked -e dev
          echo "$PWD/.pixi/envs/dev/bin" >> "$GITHUB_PATH"
      - name: Format with Black
        run: >-
          black --check
          app/modules/launchers
          app/modules/f2w_agent/kg_update.py
          splash_links/scripts/import_kg.py
      - name: Lint with flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings. Line length comes from .flake8 (115), the same
          # value every other flake8 run uses; the old 127 override made reports disagree (T27).
          flake8 . --count --exit-zero --max-complexity=10 --statistics
      - name: Test with pytest (parallel; the slow scale tests run in the nightly job)
        run: pytest -n auto -m "not slow"
      - name: Build MkDocs site strictly
        run: mkdocs build --strict -f mkdocs/mkdocs.yml

  docs-deploy:
    name: Deploy MkDocs to GitHub Pages (push to main only)
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !inputs.publish_candidate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with: { fetch-depth: 0 }
      - name: Install pixi (pinned release, sha256-verified)
        run: scripts/ci/install_pixi.sh
      - name: Install the locked dev environment (pixi.lock, --locked)
        run: |
          pixi install --locked -e dev
          echo "$PWD/.pixi/envs/dev/bin" >> "$GITHUB_PATH"
      - name: Build MkDocs site
        run: mkdocs gh-deploy --force -f mkdocs/mkdocs.yml
      - name: Update Readme Tree
        run: python scripts/update_readme_tree.py

  image-static-tests:
    name: Image static tests (tests/images, tests/ci)
    # A push to main (or a v* tag) builds its candidates once, inside publish-image.yml's call
    # of this workflow (publish_candidate=true); the standalone main run skips the image jobs.
    if: github.event_name != 'push' || github.ref != 'refs/heads/main' || inputs.publish_candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with: { persist-credentials: false }
      - name: No .env in the checkout
        run: test ! -e .env
      - name: Install pixi (pinned release, sha256-verified)
        run: scripts/ci/install_pixi.sh
      - name: Install the locked dev environment (pixi.lock, --locked)
        run: |
          pixi install --locked -e dev
          echo "$PWD/.pixi/envs/dev/bin" >> "$GITHUB_PATH"
      - name: Dockerfile model, build context, profiles, supervisor, workflow rules
        run: |
          mkdir -p "$RUNNER_TEMP/home"
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/home" TMPDIR="$RUNNER_TEMP" LANG=C.UTF-8 \
            python -m pytest tests/images tests/ci -q -p no:cacheprovider

  build-candidates:
    name: Build and check local, als-dev, als-prod from one commit
    needs: image-static-tests
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with: { persist-credentials: false }
      - name: No .env in the checkout
        run: test ! -e .env
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - name: Free runner disk for three images
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Resolve base images once (same bytes for all three variants; D2.9 records the digests)
        id: base
        run: |
          set -euo pipefail
          docker pull "$BASE_PYTHON_IMAGE"
          docker pull "$BASE_NODE_IMAGE"
          python_ref="$(docker image inspect --format '{{index .RepoDigests 0}}' "$BASE_PYTHON_IMAGE")"
          node_ref="$(docker image inspect --format '{{index .RepoDigests 0}}' "$BASE_NODE_IMAGE")"
          echo "python=$python_ref" >> "$GITHUB_OUTPUT"
          echo "node=$node_ref" >> "$GITHUB_OUTPUT"
          echo "python base: $python_ref"; echo "node base: $node_ref"
      - name: Build the three variants
        env:
          PYTHON_REF: ${{ steps.base.outputs.python }}
        run: |
          set -euo pipefail
          for variant in local als-dev als-prod; do
            docker buildx build --load --provenance=false --sbom=false \
              --target "$variant" \
              --build-arg "PYTHON_IMAGE=$PYTHON_REF" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              -t "$CANDIDATE:$variant" .
          done
          docker image ls "$CANDIDATE"
      - name: Post-build checks on each image (README "Static checks on the built images")
        run: |
          set -euo pipefail
          tiled_version="$(sed -n 's/^PINNED_TILED_VERSION = "\(.*\)"$/\1/p' app/modules/deployment/tiled_config.py)"
          status=0
          for variant in local als-dev als-prod; do
            python scripts/ci/image_checks.py --variant "$variant" --image "$CANDIDATE:$variant" \
              --commit "$GITHUB_SHA" --tiled-version "$tiled_version" \
              --out "candidate/manifest/checks-$variant.json" || status=1
          done
          exit "$status"
      - name: Release manifest (base-image digests D2.9; newest binary report referenced, never gating, D2.10)
        if: always()
        env:
          PYTHON_REF: ${{ steps.base.outputs.python }}
          NODE_REF: ${{ steps.base.outputs.node }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          image_repository="$(echo "ghcr.io/$OWNER/fair2wise" | tr '[:upper:]' '[:lower:]')"
          python scripts/ci/release_manifest.py build \
            --commit "$GITHUB_SHA" --ref "$GITHUB_REF" --event "$GITHUB_EVENT_NAME" \
            --repository "$GITHUB_REPOSITORY" --image-repository "$image_repository" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --server-url "$GITHUB_SERVER_URL" \
            --checks candidate/manifest/checks-local.json candidate/manifest/checks-als-dev.json \
                     candidate/manifest/checks-als-prod.json \
            --base-image "$BASE_PYTHON_IMAGE=$PYTHON_REF" --base-image "$BASE_NODE_IMAGE=$NODE_REF" \
            --binary-report latest \
            --out candidate/manifest/release-manifest.json
          {
            echo "### Release manifest ($GITHUB_SHA)"
            echo '```json'
            python -c 'import json,sys; m=json.load(open(sys.argv[1])); print(json.dumps({"candidate_ok": m["candidate_ok"], "problems": m["problems"], "variants": {k: v["image_id"] for k, v in m["variants"].items()}, "base_image_digests": m["base_image_digests"], "binary_report": (m["binary_report"] or {}).get("path")}, indent=2))' candidate/manifest/release-manifest.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: release-manifest
          path: candidate/manifest/
          retention-days: 90
          if-no-files-found: error
      - name: Save the tested images (trusted events only)
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          mkdir -p candidate/images
          docker save "$CANDIDATE:local" "$CANDIDATE:als-dev" "$CANDIDATE:als-prod" | gzip -1 > candidate/images/images.tar.gz
          (cd candidate/images && sha256sum images.tar.gz > images.tar.gz.sha256 && cat images.tar.gz.sha256)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: github.event_name != 'pull_request'
        with:
          name: release-images
          path: candidate/images/
          # D2.7 (keep everything): 90 days is the longest GitHub allows for a workflow artifact;
          # the published images themselves never expire (no GHCR retention policy).
          retention-days: 90
          compression-level: 0
          if-no-files-found: error
