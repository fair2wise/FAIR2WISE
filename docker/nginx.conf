# FAIR2WISE gateway (T24C): the one and only /fair2wise prefix-stripping boundary.
#
# Contract: docs/migration/companion/DEPLOYMENT_STRATEGY.md section 3 (D26) and
# app/modules/deployment/gateway.py. The edge (Ansible/Traefik) forwards /fair2wise
# unchanged; this server strips /fair2wise/api exactly once; the API keeps its rooted
# routes and runs with root_path=/fair2wise/api (F2W_PUBLIC_PREFIX=/fair2wise).
#
# This file is an http-context include (conf.d) and a template: ${F2W_API_UPSTREAM} is
# the private API host:port (127.0.0.1:8090 in the combined image, agent:8090 in
# compose.yaml) and ${F2W_GATEWAY_PORT} the listen port (default 8080, the one container
# ingress of the T24A contract; unprivileged, so nginx needs no setcap). The nginx image
# fills both with envsubst from
# /etc/nginx/templates/default.conf.template; elsewhere use
#   python app/modules/deployment/gateway.py render-nginx --template docker/nginx.conf
# Plain nginx variables in this file never use the dollar-brace form.
#
# Static layout: the UI build is at <root>/fair2wise/ and the MkDocs site at
# <root>/fair2wise/docs/. Nothing outside /fair2wise is served except /healthz and a
# redirect from / to the UI. No Tiled or file-store endpoint is proxied.
#
# Model-compatible API (owner decision B7, O-A9, 2026-10-30): /fair2wise/model-api/<path> is
# forwarded to the same API process as /model-api/<path>, where app/api/main.py mounts
# app/modules/kg_rag_api.py. The same sign-in applies (the ALS session cookie, Path=/fair2wise,
# reaches both). The alias /fair2wise/api/model-api/... is refused so the model API has one
# public path.

upstream f2w_api {
    server ${F2W_API_UPSTREAM};
    keepalive 16;
}

# The raw (still percent-encoded) API suffix after /fair2wise/api, with its query.
# Proxying the raw suffix keeps the exact bytes the browser sent (encoded node ids,
# slashes); only the prefix is removed. Empty when the raw URI does not start with
# the literal prefix (for example //fair2wise/api/...), which is then refused.
map $request_uri $f2w_api_uri {
    default "";
    "~^/fair2wise/api(?<f2w_rest>/[^?]*)(?<f2w_query>\?.*)?$" $f2w_rest$f2w_query;
}

# The model API keeps its /model-api mount segment: /fair2wise/model-api/<p> -> /model-api/<p>.
map $request_uri $f2w_model_api_uri {
    default "";
    "~^/fair2wise/model-api(?<f2w_mrest>/[^?]*)(?<f2w_mquery>\?.*)?$" /model-api$f2w_mrest$f2w_mquery;
}

# Scheme seen by the API for the URLs it builds. Only the two literal values are passed
# on; uvicorn believes it only from the loopback gateway (FORWARDED_ALLOW_IPS). The ALS
# edge must set/overwrite X-Forwarded-Proto (open item for Ansible, T24E).
map $http_x_forwarded_proto $f2w_forwarded_proto {
    default $scheme;
    http http;
    https https;
}

server {
    listen ${F2W_GATEWAY_PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # nginx's own redirects stay relative: no Host, scheme or port is guessed.
    absolute_redirect off;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /fair2wise/healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Convenience for a bare host:port; not a root alias of any content.
    location = / {
        return 302 /fair2wise/;
    }

    location = /fair2wise {
        return 301 /fair2wise/$is_args$args;
    }

    # UI agent API: strip /fair2wise/api once, stream without buffering.
    location ^~ /fair2wise/api/ {
        if ($f2w_api_uri = "") {
            return 404;
        }
        proxy_pass http://f2w_api$f2w_api_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $f2w_forwarded_proto;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_redirect off;
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering on;
        gzip off;
        client_max_body_size 128m;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # The API root itself is not a route; never let it reach the SPA.
    location = /fair2wise/api {
        return 404;
    }

    # The model API is never reached through the UI API prefix: one public path (B7).
    location ^~ /fair2wise/api/model-api {
        return 404;
    }

    # Model-compatible API (B7): same process, same settings as the UI API location above.
    location ^~ /fair2wise/model-api/ {
        if ($f2w_model_api_uri = "") {
            return 404;
        }
        proxy_pass http://f2w_api$f2w_model_api_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $f2w_forwarded_proto;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_redirect off;
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering on;
        gzip off;
        client_max_body_size 128m;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # The model API root itself is not a route either.
    location = /fair2wise/model-api {
        return 404;
    }

    location = /fair2wise/docs {
        return 301 /fair2wise/docs/$is_args$args;
    }

    # MkDocs site (owner O-A7), plain static files: a directory without its slash gets a
    # relative 301 to the slash form (MkDocs pages link relatively), a missing page is 404.
    location ^~ /fair2wise/docs/ {
        index index.html;
    }

    # Hashed build assets: long cache, and a missing asset is 404, never index.html.
    location ^~ /fair2wise/assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Any other file-like path under the prefix is served if present, else 404.
    # (Quoted: nginx requires quotes around a regex that contains braces.)
    location ~ "^/fair2wise/.+\.[A-Za-z0-9]{1,8}$" {
        try_files $uri =404;
    }

    # The UI entry document is never cached, so a new release is picked up at once.
    location = /fair2wise/index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # UI deep links: SPA fallback inside the UI namespace only.
    location /fair2wise/ {
        try_files $uri /fair2wise/index.html;
    }

    location / {
        return 404;
    }
}
