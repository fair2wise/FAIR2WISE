# FAIR2WISE opt-in: prefer IPv6 over IPv4 when the container's only IPv6 address is a ULA
# (Docker on Colima / Docker Desktop with IPv6 enabled gives containers fd00::/8 addresses).
#
# Why: CBORG allowlists the developer's public IPv6 address, so the container must leave over
# IPv6 (NAT66 on the host); glibc's default RFC 6724 table gives fc00::/7 (ULA) label 6 and
# ::/0 label 1, so a ULA source never matches a global destination's label and getaddrinfo
# sorts the IPv4 destination first. Giving fc00::/7 the same label as ::/0 makes the IPv6
# destination win. Everything else is glibc's default table (a gai.conf with any label line
# replaces the whole table, so it has to be complete).
#
# Not baked into the image (/etc is root-owned and the runtime user is 10001): mount it
# read-only when you need it (docker/profiles/README.md, "IPv6 preference"):
#   -v "$PWD/docker/gai.conf:/etc/gai.conf:ro"
# No behaviour changes without the mount.
label ::1/128       0
label ::/0          1
label 2002::/16     2
label ::/96         3
label ::ffff:0:0/96 4
label fec0::/10     5
label fc00::/7      1
label 2001:0::/32   7
