# Main nginx configuration of the combined FAIR2WISE images (T24B).
#
# nginx runs as the unprivileged image user under the supervisor, in the foreground. The
# server block is the T24C gateway (docker/nginx.conf), rendered by preflight.py with
# app/modules/deployment/gateway.py into /run/fair2wise/nginx/conf.d/default.conf.
# All writable paths are under /run/fair2wise/nginx (created by preflight).

daemon off;
worker_processes auto;
pid /run/fair2wise/nginx/nginx.pid;
error_log stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;

    client_body_temp_path /run/fair2wise/nginx/tmp/client_body;
    proxy_temp_path /run/fair2wise/nginx/tmp/proxy;
    fastcgi_temp_path /run/fair2wise/nginx/tmp/fastcgi;
    uwsgi_temp_path /run/fair2wise/nginx/tmp/uwsgi;
    scgi_temp_path /run/fair2wise/nginx/tmp/scgi;

    include /run/fair2wise/nginx/conf.d/*.conf;
}
